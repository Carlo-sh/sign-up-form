<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sign-up Form</title>
  </head>
  <body>
    <div id="left-container">
      <div id="left-inner-container">
        <div id="title-container">
          <img src="./images/odin-lined.png" alt="odin logo" />
          <h1>odin</h1>
        </div>
        <footer>
          <small
            >photo by
            <a href="https://haliewestphotography.com/">halie west</a> on
            <a href="https://unsplash.com/">unsplash</a></small
          >
        </footer>
      </div>
    </div>
    <div id="right-container">
      <div id="upper-right-container">
        <div id="paragraph-container">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p>Sign up <i>now</i> to get started.</p>
          <p>You <i>know</i> you want to.</p>
        </div>
      </div>
      <div id="middle-right-container">
        <form>
          <fieldset>
            <legend>Let's do this!</legend>
            <div id="input-container">
              <div>
                <label for="first-name">first name</label>
                <input type="text" name="first-name" id="first-name" />
              </div>
              <div>
                <label for="last-name">last name</label>
                <input type="text" name="last-name" id="last-name" />
              </div>
              <div>
                <label for="email">email</label>
                <input type="email" name="email" id="email" />
              </div>
              <div>
                <label for="phone-number">phone-number</label>
                <input type="tel" name="phone-number" id="phone-number" />
              </div>
              <div>
                <label for="password">password</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  pattern=".{8,}"
                />
              </div>
              <div>
                <label for="confirm-password">confirm password</label>
                <input
                  type="password"
                  name="confirm-password"
                  id="confirm-password"
                  pattern=".{8,}"
                />
              </div>
            </div>
          </fieldset>
        </form>
      </div>
      <div id="bottom-right-container">
        <button type="submit">create account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
